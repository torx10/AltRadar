name: Build and sync upstream

# push:              build AltRadar and publish AltRadar.dll as a release.
# schedule / manual: merge POEFixer/Radar into main if it merges cleanly and still
#                    builds, then push and release. Conflicts or a broken build fail
#                    the run (GitHub emails you) and push nothing.
on:
  push:
    branches: [main, restructure/upstream-layout]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/POEFixer/Radar master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "Merge upstream POEFixer/Radar" FETCH_HEAD; then
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "::error::Upstream conflicts with main (files above). Merge by hand: git fetch upstream && git merge upstream/master"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: microsoft/setup-msbuild@v2
        if: github.event_name == 'push' || steps.merge.outputs.changed == 'true'

      - name: Build AltRadar
        if: github.event_name == 'push' || steps.merge.outputs.changed == 'true'
        shell: pwsh  # setup-msbuild puts msbuild on the PowerShell PATH, not bash's
        run: msbuild AltRadar.sln -p:Configuration=Release -p:Platform=x64 -m

      - name: Push merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # Pushes made by this workflow don't start new runs, so the sync releases here too.
      - name: Publish release
        if: github.event_name == 'push' || steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
        run: |
          sha=$(git rev-parse HEAD)
          prerelease=$([ "$BRANCH" = main ] || echo --prerelease)
          gh release create "build-${{ github.run_number }}" Plugins/AltRadar/bin/Release/AltRadar.dll \
            --target "$sha" $prerelease \
            --title "AltRadar build ${{ github.run_number }} ($BRANCH, ${sha:0:7})" \
            --notes "Built from \`$BRANCH\` at $sha. Copy AltRadar.dll into POE2Fixer/Plugins/AltRadar/."
